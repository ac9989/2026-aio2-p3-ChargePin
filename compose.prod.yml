name: chargepin-aws

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chargepin}
      POSTGRES_USER: ${POSTGRES_USER:-chargepin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}
    volumes:
      - chargepin_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/ac9989/chargepin-backend:sha-${CHARGEPIN_DEPLOY_SHA:?Deploy SHA is required}
    env_file:
      - .env
    environment:
      CHARGEPIN_ENABLE_TEST_SCENARIOS: "false"
      CHARGEPIN_LOG_DIR: /app/logs
      CHARGEPIN_DATABASE_ENABLED: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-chargepin}
      POSTGRES_USER: ${POSTGRES_USER:-chargepin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required for production}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ghcr.io/ac9989/chargepin-frontend:sha-${CHARGEPIN_DEPLOY_SHA:?Deploy SHA is required}
    environment:
      CHARGEPIN_API_BASE_URL: http://backend:8000/api/v1
      CHARGEPIN_DASHBOARD_SERVER_OPS: "true"
      KAKAO_JAVASCRIPT_KEY: ${KAKAO_JAVASCRIPT_KEY:-}
      CHARGEPIN_DASHBOARD_SERVER_OPS: "true"
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  chargepin_postgres_data:
