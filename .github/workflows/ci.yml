name: ChargePin CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r Backend/requirements.txt
      - name: Run backend tests
        working-directory: Backend
        run: python -m pytest -q

  frontend-syntax:
    name: Frontend syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Frontend/requirements.txt
      - name: Install frontend test dependencies
        run: python -m pip install -r Frontend/requirements.txt
      - name: Check frontend Python syntax
        run: python -m compileall -q Frontend
      - name: Run frontend tests
        working-directory: Frontend
        run: python -m pytest -q

  autohealing-tests:
    name: Existing Auto Healing policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner
        run: python -m pip install pytest==8.3.5
      - name: Run watcher unit tests
        run: python -m pytest -q tests/ops
      - name: Test real Docker healthcheck rollback in isolated containers
        run: bash tests/ops/run_rollback_integration.sh

  docker-build:
    name: Validate Compose and build images
    runs-on: ubuntu-latest
    needs:
      - frontend-syntax
      - autohealing-tests
    steps:
      - uses: actions/checkout@v4
      - name: Create non-secret CI environment
        run: cp .env.example .env
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build backend and frontend
        run: docker compose build backend frontend

  publish-images:
    name: Publish both images to GHCR (main only)
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ghcr.io/ac9989/chargepin-backend:latest
            ghcr.io/ac9989/chargepin-backend:sha-${{ github.sha }}
      - name: Publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/ac9989/chargepin-frontend:latest
            ghcr.io/ac9989/chargepin-frontend:sha-${{ github.sha }}
