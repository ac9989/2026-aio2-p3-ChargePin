name: ChargePin CD Safe Failure Test

on:
  push:
    branches: [feature/cd-deploy]
    paths:
      - ".github/workflows/cd-safe-failure-test.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: chargepin-production-deploy
  cancel-in-progress: false

jobs:
  ensure-pull-failure-does-not-change-service:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Verify nonexistent image is rejected without modifying running service
        shell: bash
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          jq -n '{
            commands: [
              "set -eu",
              "cd /home/ubuntu/chargepin",
              "test \"$(cat ops/deploy-state/last_successful_sha)\" = c39e5c50d936d45cade1e880737e3e34ab5ff70a",
              "if python3 ops/deploy.py ffffffffffffffffffffffffffffffffffffffff; then echo UNEXPECTED_DEPLOY_SUCCESS; exit 1; fi",
              "test \"$(cat ops/deploy-state/last_successful_sha)\" = c39e5c50d936d45cade1e880737e3e34ab5ff70a",
              "test \"$(docker inspect --format \"{{.State.Health.Status}}\" chargepin-aws-backend-1)\" = healthy",
              "test \"$(docker inspect --format \"{{.State.Health.Status}}\" chargepin-aws-frontend-1)\" = healthy",
              "test \"$(docker inspect --format \"{{.State.Health.Status}}\" chargepin-aws-postgres-1)\" = healthy",
              "test \"$(docker inspect --format \"{{.State.Health.Status}}\" chargepin-aws-redis-1)\" = healthy"
            ],
            executionTimeout: ["240"]
          }' > /tmp/chargepin-cd-safe-failure.json
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ChargePin expected image pull failure with service preservation" \
            --parameters file:///tmp/chargepin-cd-safe-failure.json \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $COMMAND_ID"
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success)
                echo "PASS: missing image rejected; four running containers remain healthy"
                exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "FAIL: expected-failure guard did not meet assertions ($STATUS)"
                exit 1 ;;
              Pending|InProgress|Delayed) sleep 5 ;;
              *) echo "Unexpected SSM status: $STATUS"; exit 1 ;;
            esac
          done
          echo "FAIL: SSM result timed out"
          exit 1
