name: ChargePin Docker Rollback Integration

on:
  push:
    branches: [feature/cd-deploy]
    paths:
      - "tests/ops/run_rollback_integration.sh"
      - "ops/deploy.py"
      - ".github/workflows/docker-rollback-integration.yml"

permissions:
  contents: read

jobs:
  isolated-health-failure-and-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute real Docker healthcheck-failure and rollback in isolated project
        shell: bash
        run: bash tests/ops/run_rollback_integration.sh
