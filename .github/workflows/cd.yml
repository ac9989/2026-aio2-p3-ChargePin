name: ChargePin CD (AWS SSM)

on:
  push:
    branches: [feature/cd-deploy]
    paths:
      - ".github/workflows/cd.yml"
      - "compose.prod.yml"
      - "ops/deploy.py"
  workflow_run:
    workflows: ["ChargePin CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  validate-cd:
    name: Validate CD configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment script syntax
        run: python -m py_compile ops/deploy.py
      - name: Check Compose template with test-only values
        env:
          CHARGEPIN_DEPLOY_SHA: "0000000000000000000000000000000000000000"
        run: |
          cp .env.example .env
          docker compose -f compose.prod.yml config --quiet

  deploy:
    name: Deploy successful main build via SSM
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    needs: validate-cd
    runs-on: ubuntu-latest
    concurrency:
      group: chargepin-production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate deployment target configuration
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          REGION: ${{ vars.AWS_REGION }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]] || { echo "EC2_INSTANCE_ID is missing or invalid"; exit 1; }
          [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]] || { echo "AWS_ROLE_ARN is missing or invalid"; exit 1; }
          [[ "$REGION" == "ap-northeast-2" ]] || { echo "Unexpected AWS_REGION"; exit 1; }
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy commit using AWS Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DEPLOY_SHA}"
          jq -n --arg base "$BASE" --arg sha "$DEPLOY_SHA" '{
            commands: [
              "set -eu",
              "test -f /home/ubuntu/chargepin/.env",
              "mkdir -p /home/ubuntu/chargepin/ops",
              ("curl -fsSL --retry 3 -o /home/ubuntu/chargepin/compose.prod.yml " + $base + "/compose.prod.yml"),
              ("curl -fsSL --retry 3 -o /home/ubuntu/chargepin/ops/deploy.py " + $base + "/ops/deploy.py"),
              ("cd /home/ubuntu/chargepin && python3 ops/deploy.py " + $sha)
            ],
            executionTimeout: ["900"]
          }' > /tmp/chargepin-ssm-params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ChargePin main deployment" \
            --parameters file:///tmp/chargepin-ssm-params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM command submitted: $COMMAND_ID"

          for attempt in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success)
                echo "Deployment succeeded: $DEPLOY_SHA"
                exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed: $STATUS (command $COMMAND_ID)"
                exit 1 ;;
              Pending|InProgress|Delayed)
                sleep 10 ;;
              *)
                echo "Unexpected SSM status: $STATUS"
                exit 1 ;;
            esac
          done
          echo "Timed out waiting for SSM command $COMMAND_ID"
          exit 1

  notify-failure:
    name: Notify CD failure to Discord
    runs-on: ubuntu-latest
    needs: [validate-cd, deploy]
    if: ${{ failure() }}
    steps:
      - name: Send failure alert to team channel
        env:
          WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          MSG: "❌ ChargePin 배포 실패 (자동 롤백 여부는 실행 로그 확인) · ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "ALERT_WEBHOOK_URL not set, skip"
            exit 0
          fi
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "$(jq -n --arg m "$MSG" '{content:$m}')" "$WEBHOOK_URL"
