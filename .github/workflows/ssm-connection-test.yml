name: ChargePin SSM Connection Test

on:
  push:
    branches: [feature/cd-deploy]
    paths:
      - ".github/workflows/ssm-connection-test.yml"

permissions:
  contents: read
  id-token: write

jobs:
  ssm-read-only-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate AWS variables
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INSTANCE_ID" =~ ^i-[0-9a-f]{8,17}$ ]] || exit 1
          [[ "$AWS_REGION" == "ap-northeast-2" ]] || exit 1
          [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]] || exit 1
      - name: Authenticate to AWS via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Send read-only test command to EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ChargePin read-only GitHub OIDC SSM connectivity test" \
            --parameters 'commands=["printf CHARGEPIN_SSM_OK\\n","id -un"]' \
            --query 'Command.CommandId' --output text)
          echo "SSM command ID: $COMMAND_ID"
          for attempt in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success)
                echo "GitHub OIDC and SSM command execution succeeded"
                exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "SSM execution failed: $STATUS"
                exit 1 ;;
              Pending|InProgress|Delayed) sleep 5 ;;
              *) echo "Unexpected SSM state: $STATUS"; exit 1 ;;
            esac
          done
          echo "SSM test timed out"
          exit 1
