name: ChargePin Safe CD End-to-End Test

on:
  push:
    branches: [feature/cd-deploy]
    paths:
      - ".github/workflows/cd-e2e-test.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: chargepin-production-deploy
  cancel-in-progress: false

jobs:
  deploy-existing-sha:
    name: Verify GitHub OIDC to SSM to existing healthy deployment
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_SHA: c39e5c50d936d45cade1e880737e3e34ab5ff70a
    steps:
      - name: Verify variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$INSTANCE_ID" == "i-0320d86dd35e65b31" ]] || exit 1
          [[ "$AWS_REGION" == "ap-northeast-2" ]] || exit 1
          [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/.+$ ]] || exit 1
      - name: Authenticate to AWS via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Redeploy already successful SHA and verify health via SSM
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg sha "$DEPLOY_SHA" '{
            commands: [
              "set -eu",
              "cd /home/ubuntu/chargepin",
              ("test \"$(cat ops/deploy-state/last_successful_sha)\" = " + $sha),
              ("python3 ops/deploy.py " + $sha),
              "curl -fsS http://127.0.0.1:8000/healthz >/dev/null",
              "curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null",
              "docker inspect --format \"{{.State.Health.Status}}\" chargepin-aws-postgres-1 | grep -qx healthy",
              "docker inspect --format \"{{.State.Health.Status}}\" chargepin-aws-redis-1 | grep -qx healthy"
            ],
            executionTimeout: ["360"]
          }' > /tmp/chargepin-safe-cd-e2e.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "ChargePin safe CD test with already successful commit" \
            --parameters file:///tmp/chargepin-safe-cd-e2e.json \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $COMMAND_ID"
          for attempt in $(seq 1 70); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success)
                echo "End-to-end test passed; backend, frontend, PostgreSQL and Redis healthy"
                exit 0 ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "SSM command failed ($STATUS); inspect SSM command output"
                exit 1 ;;
              Pending|InProgress|Delayed) sleep 5 ;;
              *) echo "Unknown SSM status: $STATUS"; exit 1 ;;
            esac
          done
          echo "SSM command did not finish in time"
          exit 1
