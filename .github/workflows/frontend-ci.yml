name: ChargePin Frontend CI

on:
  push:
    branches:
      - main
      - feat/frontend-docker-ci
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend and Auto Healing Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r frontend/requirements.txt

      - name: Run frontend tests
        working-directory: frontend
        run: python -m unittest discover -s ../tests/frontend -v

      - name: Run Auto Healing unit tests
        run: python -m unittest discover -s tests/ops -v

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: frontend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        env:
          POSTGRES_USER: ev_user
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_DB: ev_app
        run: docker compose -f compose.yaml -f compose.frontend.yaml config --quiet

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile -t chargepin-frontend:ci frontend

  publish-frontend:
    name: Publish Frontend to GHCR
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/ac9989/chargepin-frontend:latest
            ghcr.io/ac9989/chargepin-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ac9989/2026-aio2-p3-ChargePin
            org.opencontainers.image.description=ChargePin preview frontend
