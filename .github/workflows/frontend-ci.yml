name: ChargePin Frontend CI

on:
  push:
    branches:
      - main
      - feat/frontend-docker-ci
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend 31 Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: frontend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r frontend/requirements.txt

      - name: Run frontend tests
        working-directory: frontend
        run: python -m unittest discover -s ../tests/frontend -v

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: frontend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        env:
          POSTGRES_USER: ev_user
          POSTGRES_PASSWORD: ci-only-placeholder
          POSTGRES_DB: ev_app
        run: docker compose -f compose.yaml -f compose.frontend.yaml config --quiet

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile -t chargepin-frontend:ci frontend
