<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800"><title>00 문서 개요 · 화면 흐름</title><defs><linearGradient id="bolt" x2="0" y2="1"><stop stop-color="#FFD064"/><stop offset=".5" stop-color="#FF8E3C"/><stop offset="1" stop-color="#EC4F51"/></linearGradient></defs><g font-family="Pretendard, Malgun Gothic, sans-serif"><rect x="0" y="0" width="1600" height="1800" rx="0" fill="#F8FAFC" stroke="none"/><rect x="0" y="0" width="1600" height="136" rx="0" fill="#EDF1F5" stroke="none"/><rect x="48" y="30" width="70" height="28" rx="14" fill="#292E35" stroke="none"/><text x="59" y="50" font-size="13" fill="white" font-weight="650">00</text><text x="170" y="56" font-size="30" fill="#202830" font-weight="750">문서 개요 · 화면 흐름</text><text x="48" y="98" font-size="17" fill="#657180" font-weight="400">참고 PDF의 번호 주석·명세표 형식 / 현재 Frontend 소스와 Docker 로컬 실행 기준</text><rect x="48" y="166" width="1504" height="840" rx="18" fill="white" stroke="#D7DFE7"/><g id="screen" transform="translate(80 190)"><rect x="0" y="0" width="1440" height="110" rx="0" fill="white" stroke="none"/><rect x="28" y="24" width="48" height="48" rx="15" fill="#292E35" stroke="none"/><path d="M55 30 40 52H51L47 67 63 45H53Z" fill="url(#bolt)"/><text x="90" y="48" font-size="24" fill="#202830" font-weight="750">ChargePin</text><text x="90" y="72" font-size="14" fill="#657180" font-weight="400">서울 전기차 충전소 안내</text><circle cx="1312" cy="48" r="22" fill="#F5F7F9" stroke="#D7DFE7"/><text x="1301" y="56" font-size="24" fill="#292E35" font-weight="400">⚙</text><circle cx="1372" cy="48" r="22" fill="#F5F7F9" stroke="#D7DFE7"/><path d="M1372 34V47 M1363 39 A13 13 0 1 0 1381 39" fill="none" stroke="#292E35" stroke-width="2.5"/><rect x="28" y="104" width="1384" height="1" rx="0" fill="#D7DFE7" stroke="none"/><text x="45" y="172" font-size="30" fill="#202830" font-weight="750">사용자 니즈를 대화로 좁히는 충전소 탐색</text><text x="45" y="212" font-size="18" fill="#657180" font-weight="400">탐색과 AI 챗은 같은 결과 영역을 사용합니다.</text><rect x="45" y="260" width="420" height="400" rx="14" fill="white" stroke="#D7DFE7"/><text x="65" y="295" font-size="19" fill="#202830" font-weight="750">사용자 흐름</text><rect x="65" y="325" width="380" height="50" rx="10" fill="#F3F5F7" stroke="none"/><text x="80" y="357" font-size="19" fill="#202830" font-weight="650">차지핀 시작하기</text><rect x="65" y="395" width="380" height="50" rx="10" fill="#F3F5F7" stroke="none"/><text x="80" y="427" font-size="19" fill="#202830" font-weight="650">접속 코드 입력</text><rect x="65" y="465" width="380" height="50" rx="10" fill="#F3F5F7" stroke="none"/><text x="80" y="497" font-size="19" fill="#202830" font-weight="650">탐색 또는 AI 챗</text><rect x="65" y="535" width="380" height="50" rx="10" fill="#F3F5F7" stroke="none"/><text x="80" y="567" font-size="19" fill="#202830" font-weight="650">지도 · 충전소 결과</text><rect x="510" y="260" width="420" height="400" rx="14" fill="white" stroke="#D7DFE7"/><text x="530" y="295" font-size="19" fill="#202830" font-weight="750">운영 흐름</text><rect x="530" y="325" width="380" height="50" rx="10" fill="#F3F5F7" stroke="none"/><text x="545" y="357" font-size="19" fill="#202830" font-weight="650">관리자 접속</text><rect x="530" y="395" width="380" height="50" rx="10" fill="#F3F5F7" stroke="none"/><text x="545" y="427" font-size="19" fill="#202830" font-weight="650">톱니바퀴로 화면 전환</text><rect x="530" y="465" width="380" height="50" rx="10" fill="#F3F5F7" stroke="none"/><text x="545" y="497" font-size="19" fill="#202830" font-weight="650">운영 개요 / 서비스 운영</text><rect x="530" y="535" width="380" height="50" rx="10" fill="#F3F5F7" stroke="none"/><text x="545" y="567" font-size="19" fill="#202830" font-weight="650">배포 · 감사 이력</text><rect x="975" y="260" width="420" height="400" rx="14" fill="white" stroke="#D7DFE7"/><text x="995" y="295" font-size="19" fill="#202830" font-weight="750">현재 데이터 경계</text><rect x="995" y="325" width="380" height="50" rx="10" fill="#F3F5F7" stroke="none"/><text x="1010" y="357" font-size="19" fill="#202830" font-weight="650">지도 · 장소: 카카오</text><rect x="995" y="395" width="380" height="50" rx="10" fill="#F3F5F7" stroke="none"/><text x="1010" y="427" font-size="19" fill="#202830" font-weight="650">충전 정보: 환경공단</text><rect x="995" y="465" width="380" height="50" rx="10" fill="#F3F5F7" stroke="none"/><text x="1010" y="497" font-size="19" fill="#202830" font-weight="650">아파트 식별 결과 제외</text><rect x="995" y="535" width="380" height="50" rx="10" fill="#F3F5F7" stroke="none"/><text x="1010" y="567" font-size="19" fill="#202830" font-weight="650">운영 지표: 연결 대기</text></g><text x="48" y="1054" font-size="24" fill="#202830" font-weight="750">구성요소 명세</text><text x="1280" y="1054" font-size="15" fill="#657180" font-weight="400">Docker local · 2026.11.05</text><rect x="48" y="1076" width="1504" height="42" rx="8" fill="#292E35" stroke="none"/><text x="64" y="1103" font-size="15" fill="white" font-weight="650">No</text><text x="126" y="1103" font-size="15" fill="white" font-weight="650">구성요소</text><text x="360" y="1103" font-size="15" fill="white" font-weight="650">동작 · 표시 규칙</text><text x="1120" y="1103" font-size="15" fill="white" font-weight="650">데이터 · API / 상태</text><rect x="48" y="1118" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1146" font-size="16" fill="#202830" font-weight="750">1</text><text x="126" y="1146" font-size="17" fill="#202830" font-weight="650">실행 기준</text><text x="360" y="1143" font-size="15" fill="#657180" font-weight="400">사용자와 운영 화면은 별도 주소 없이 동일 앱 내부에서 전환합니다.</text><text x="1120" y="1143" font-size="14" fill="#657180" font-weight="400">http://localhost:8501</text><rect x="48" y="1186" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1214" font-size="16" fill="#202830" font-weight="750">2</text><text x="126" y="1214" font-size="17" fill="#202830" font-weight="650">표현 규칙</text><text x="360" y="1211" font-size="15" fill="#657180" font-weight="400">연결 대기, 정보 지연, 확인 필요를 구분하며 운영 수치를 임의로 생성하지 않습니다.</text><text x="1120" y="1211" font-size="14" fill="#657180" font-weight="400">Frontend/app.py</text><rect x="48" y="1254" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1282" font-size="16" fill="#202830" font-weight="750">3</text><text x="126" y="1282" font-size="17" fill="#202830" font-weight="650">편집 방식</text><text x="360" y="1279" font-size="15" fill="#657180" font-weight="400">화면·텍스트·주석은 벡터 요소입니다. 각 SVG를 Figma 캔버스에 드래그합니다.</text><text x="1120" y="1279" font-size="14" fill="#657180" font-weight="400">SVG / 1600 × 1800</text><rect x="48" y="1322" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1350" font-size="16" fill="#202830" font-weight="750">4</text><text x="126" y="1350" font-size="17" fill="#202830" font-weight="650">기능 상태</text><text x="360" y="1347" font-size="15" fill="#657180" font-weight="400">현재 동작과 미연결 기능을 각 화면의 확인 사항에 구분했습니다.</text><text x="1120" y="1347" font-size="14" fill="#657180" font-weight="400">API 계약은 api_client.py 기준</text><text x="48" y="1433" font-size="20" fill="#202830" font-weight="750">구현 범위 · 확인 사항</text><text x="64" y="1468" font-size="16" fill="#657180" font-weight="400">• 참고 PDF의 기존 역할 분할·검색 전 확인 UI는 복제하지 않았습니다.</text><text x="64" y="1497" font-size="16" fill="#657180" font-weight="400">• 지도는 카카오 타일 캡처가 아닌 위치 영역 도식입니다. 실측 캡처 문서가 아닙니다.</text><text x="48" y="1758" font-size="14" fill="#657180" font-weight="400">ChargePin / 화면 설계서 1.1 / 로컬 구현 기준 · 화면 속 데이터는 명세용 표기</text><text x="1480" y="1758" font-size="16" fill="#657180" font-weight="400">01</text></g></svg>