" font-weight="750">Docker · AWS 운영 상태</text><rect x="48" y="540" width="1340" height="42" rx="8" fill="#F3F5F7" stroke="none"/><circle cx="63" cy="561" r="3" fill="#96A2AF"/><text x="77" y="566" font-size="14" fill="#657180" font-weight="400">컨테이너 상태 · 이미지 버전 · 재시작 · 배포 환경 · 연결 대기</text><rect x="28" y="615" width="1380" height="110" rx="14" fill="white" stroke="#D7DFE7"/><text x="48" y="650" font-size="19" fill="#202830" font-weight="750">감사 이력</text><rect x="48" y="670" width="1340" height="42" rx="8" fill="#F3F5F7" stroke="none"/><circle cx="63" cy="691" r="3" fill="#96A2AF"/><text x="77" y="696" font-size="14" fill="#657180" font-weight="400">시각 · 작업자 · 작업 · 대상 · 결과 · 요청 ID · 연결 대기</text><circle cx="1390" cy="190" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1390" y="195" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">1</text><circle cx="1390" cy="370" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1390" y="375" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">2</text><circle cx="1390" cy="500" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1390" y="505" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">3</text><circle cx="1390" cy="630" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1390" y="635" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">4</text></g><text x="48" y="1054" font-size="24" fill="#202830" font-weight="750">구성요소 명세</text><text x="1280" y="1054" font-size="15" fill="#657180" font-weight="400">Docker local · 2026.11.05</text><rect x="48" y="1076" width="1504" height="42" rx="8" fill="#292E35" stroke="none"/><text x="64" y="1103" font-size="15" fill="white" font-weight="650">No</text><text x="126" y="1103" font-size="15" fill="white" font-weight="650">구성요소</text><text x="360" y="1103" font-size="15" fill="white" font-weight="650">동작 · 표시 규칙</text><text x="1120" y="1103" font-size="15" fill="white" font-weight="650">데이터 · API / 상태</text><rect x="48" y="1118" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1146" font-size="16" fill="#202830" font-weight="750">1</text><text x="126" y="1146" font-size="17" fill="#202830" font-weight="650">파이프라인</text><text x="360" y="1143" font-size="15" fill="#657180" font-weight="400">테스트·빌드·이미지·배포·동작 확인을 단계별로 표시할 영역입니다.</text><text x="1120" y="1143" font-size="14" fill="#657180" font-weight="400">GitHub Actions API 미연결</text><rect x="48" y="1186" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1214" font-size="16" fill="#202830" font-weight="750">2</text><text x="126" y="1214" font-size="17" fill="#202830" font-weight="650">실행 상세</text><text x="360" y="1211" font-size="15" fill="#657180" font-weight="400">실행 정보와 로그는 실제 연동 전까지 연결 대기로 표시합니다.</text><text x="1120" y="1211" font-size="14" fill="#657180" font-weight="400">워크플로 실행 / job 로그</text><rect x="48" y="1254" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1282" font-size="16" fill="#202830" font-weight="750">3</text><text x="126" y="1282" font-size="17" fill="#202830" font-weight="650">배포 환경</text><text x="360" y="1279" font-size="15" fill="#657180" font-weight="400">로컬 Docker 실행과 AWS 관측 연결 여부를 혼동하지 않습니다.</text><text x="1120" y="1279" font-size="14" fill="#657180" font-weight="400">Docker 실행 중 / AWS 관측 미연결</text><rect x="48" y="1322" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1350" font-size="16" fill="#202830" font-weight="750">4</text><text x="126" y="1350" font-size="17" fill="#202830" font-weight="650">감사 이력</text><text x="360" y="1347" font-size="15" fill="#657180" font-weight="400">운영 변경 이벤트만 조회하는 영역입니다. 현재 수집 경로는 미연결입니다.</text><text x="1120" y="1347" font-size="14" fill="#657180" font-weight="400">감사 API 미구현</text><text x="48" y="1433" font-size="20" fill="#202830" font-weight="750">구현 범위 · 확인 사항</text><text x="64" y="1468" font-size="16" fill="#657180" font-weight="400">• 로컬 Docker가 실행된다고 AWS 배포가 완료된 것은 아닙니다.</text><text x="64" y="1497" font-size="16" fill="#657180" font-weight="400">• 재배포·캐시 갱신·권한 변경 같은 쓰기 작업은 현재 이 화면에 구현되어 있지 않습니다.</text><text x="48" y="1758" font-size="14" fill="#657180" font-weight="400">ChargePin / 화면 설계서 1.1 / 로컬 구현 기준 · 화면 속 데이터는 명세용 표기</text><text x="1480" y="1758" font-size="16" fill="#657180" font-weight="400">09</text></g></svg>