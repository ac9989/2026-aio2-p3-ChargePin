nchor="middle" font-size="14" font-weight="750" fill="#292E35">4</text></g><text x="48" y="1054" font-size="24" fill="#202830" font-weight="750">구성요소 명세</text><text x="1280" y="1054" font-size="15" fill="#657180" font-weight="400">Docker local · 2026.11.05</text><rect x="48" y="1076" width="1504" height="42" rx="8" fill="#292E35" stroke="none"/><text x="64" y="1103" font-size="15" fill="white" font-weight="650">No</text><text x="126" y="1103" font-size="15" fill="white" font-weight="650">구성요소</text><text x="360" y="1103" font-size="15" fill="white" font-weight="650">동작 · 표시 규칙</text><text x="1120" y="1103" font-size="15" fill="white" font-weight="650">데이터 · API / 상태</text><rect x="48" y="1118" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1146" font-size="16" fill="#202830" font-weight="750">1</text><text x="126" y="1146" font-size="17" fill="#202830" font-weight="650">결과 수</text><text x="360" y="1143" font-size="15" fill="#657180" font-weight="400">프론트 주거시설 제외 및 시설 분류 필터가 적용된 목록의 개수를 표시합니다.</text><text x="1120" y="1143" font-size="14" fill="#657180" font-weight="400">filtered results</text><rect x="48" y="1186" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1214" font-size="16" fill="#202830" font-weight="750">2</text><text x="126" y="1214" font-size="17" fill="#202830" font-weight="650">카드 정보</text><text x="360" y="1211" font-size="15" fill="#657180" font-weight="400">시설명·주소·시설 유형·급속/완속·직선거리·상태를 표시합니다.</text><text x="1120" y="1211" font-size="14" fill="#657180" font-weight="400">ChargerResult</text><rect x="48" y="1254" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1282" font-size="16" fill="#202830" font-weight="750">3</text><text x="126" y="1282" font-size="17" fill="#202830" font-weight="650">부가 정보</text><text x="360" y="1279" font-size="15" fill="#657180" font-weight="400">이용시간·무료주차 여부·이용제한·보고 및 조회 시각을 표시합니다.</text><text x="1120" y="1279" font-size="14" fill="#657180" font-weight="400">use_time / parking_free /</text><text x="1120" y="1302" font-size="14" fill="#657180" font-weight="400">restriction_detail</text><rect x="48" y="1322" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1350" font-size="16" fill="#202830" font-weight="750">4</text><text x="126" y="1350" font-size="17" fill="#202830" font-weight="650">페이지 이동</text><text x="360" y="1347" font-size="15" fill="#657180" font-weight="400">한 페이지 10개를 2열로 표시합니다. 이전·다음과 페이지 번호는 가운데 정렬합니다.</text><text x="1120" y="1347" font-size="14" fill="#657180" font-weight="400">result_page / page_size=10</text><text x="48" y="1433" font-size="20" fill="#202830" font-weight="750">구현 범위 · 확인 사항</text><text x="64" y="1468" font-size="16" fill="#657180" font-weight="400">• 충전기 사용 상태와 주차장 만차는 별도 정보입니다. 주차 만차나 예상 빈자리 시각을 추정하지 않습니다.</text><text x="64" y="1497" font-size="16" fill="#657180" font-weight="400">• 시설 코드가 누락되면 아파트 전체를 완전하게 제외할 수 없습니다. 백엔드 코드 매핑 보완 대상입니다.</text><text x="48" y="1758" font-size="14" fill="#657180" font-weight="400">ChargePin / 화면 설계서 1.1 / 로컬 구현 기준 · 화면 속 데이터는 명세용 표기</text><text x="1480" y="1758" font-size="16" fill="#657180" font-weight="400">05</text></g></svg>