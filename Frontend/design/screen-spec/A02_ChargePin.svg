<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800"><title>A02 서비스 운영</title><defs><linearGradient id="bolt" x2="0" y2="1"><stop stop-color="#FFD064"/><stop offset=".5" stop-color="#FF8E3C"/><stop offset="1" stop-color="#EC4F51"/></linearGradient></defs><g font-family="Pretendard, Malgun Gothic, sans-serif"><rect x="0" y="0" width="1600" height="1800" rx="0" fill="#F8FAFC" stroke="none"/><rect x="0" y="0" width="1600" height="136" rx="0" fill="#EDF1F5" stroke="none"/><rect x="48" y="30" width="70" height="28" rx="14" fill="#292E35" stroke="none"/><text x="59" y="50" font-size="13" fill="white" font-weight="650">A02</text><text x="170" y="56" font-size="30" fill="#202830" font-weight="750">서비스 운영</text><text x="48" y="98" font-size="17" fill="#657180" font-weight="400">출처 연결·처리 흐름·복구·품질·오류를 한 화면에서 구분</text><rect x="48" y="166" width="1504" height="840" rx="18" fill="white" stroke="#D7DFE7"/><g id="screen" transform="translate(80 190)"><rect x="0" y="0" width="1440" height="150" rx="0" fill="#292E35" stroke="none"/><rect x="28" y="24" width="48" height="48" rx="15" fill="#41474F" stroke="none"/><path d="M55 30 40 52H51L47 67 63 45H53Z" fill="url(#bolt)"/><text x="90" y="48" font-size="24" fill="white" font-weight="750">ChargePin 운영 대시보드</text><text x="90" y="72" font-size="14" fill="#CED4DA" font-weight="400">서비스 상태 및 운영 이력</text><circle cx="1312" cy="48" r="22" fill="#41474F" stroke="#6A717A"/><text x="1301" y="56" font-size="24" fill="white" font-weight="400">⚙</text><circle cx="1372" cy="48" r="22" fill="#41474F" stroke="#6A717A"/><path d="M1372 34V47 M1363 39 A13 13 0 1 0 1381 39" fill="none" stroke="white" stroke-width="2.5"/><text x="30" y="125" font-size="17" fill="#CED4DA" font-weight="650">운영 개요</text><text x="210" y="125" font-size="17" fill="white" font-weight="650">서비스 운영</text><rect x="210" y="142" width="140" height="3" rx="0" fill="#FFBC42" stroke="none"/><text x="390" y="125" font-size="17" fill="#CED4DA" font-weight="650">배포 · 감사 이력</text><rect x="28" y="175" width="680" height="220" rx="14" fill="white" stroke="#D7DFE7"/><text x="48" y="210" font-size="19" fill="#202830" font-weight="750">외부 API</text><rect x="48" y="240" width="640" height="42" rx="8" fill="#F3F5F7" stroke="none"/><circle cx="63" cy="261" r="3" fill="#96A2AF"/><text x="77" y="266" font-size="14" fill="#657180" font-weight="400">지도·장소·환경공단의 설정 및 최근 호출 상태</text><rect x="728" y="175" width="680" height="220" rx="14" fill="white" stroke="#D7DFE7"/><text x="748" y="210" font-size="19" fill="#202830" font-weight="750">에이전트 · 재시도</text><rect x="748" y="240" width="640" height="42" rx="8" fill="#F3F5F7" stroke="none"/><circle cx="763" cy="261" r="3" fill="#96A2AF"/><text x="777" y="266" font-size="14" fill="#657180" font-weight="400">Planner · Executor · Critic · Memory Keeper</text><rect x="28" y="415" width="680" height="120" rx="14" fill="white" stroke="#D7DFE7"/><text x="48" y="450" font-size="19" fill="#202830" font-weight="750">캐시 · 복구</text><rect x="48" y="480" width="640" height="42" rx="8" fill="#F3F5F7" stroke="none"/><circle cx="63" cy="501" r="3" fill="#96A2AF"/><text x="77" y="506" font-size="14" fill="#657180" font-weight="400">캐시 조회·갱신·Circuit Breaker 연결 대기</text><rect x="728" y="415" width="680" height="120" rx="14" fill="white" stroke="#D7DFE7"/><text x="748" y="450" font-size="19" fill="#202830" font-weight="750">데이터 품질 · 가드레일</text><rect x="748" y="480" width="640" height="42" rx="8" fill="#F3F5F7" stroke="none"/><circle cx="763" cy="501" r="3" fill="#96A2AF"/><text x="777" y="506" font-size="14" fill="#657180" font-weight="400">지연·누락·이상값·차단 유형 연결 대기</text><rect x="28" y="555" width="680" height="135" rx="14" fill="white" stroke="#D7DFE7"/><text x="48" y="590" font-size="19" fill="#202830" font-weight="750">외부 API 응답 시간</text><rect x="48" y="620" width="640" height="42" rx="8" fill="#F3F5F7" stroke="none"/><circle cx="63" cy="641" r="3" fill="#96A2AF"/><text x="77" y="646" font-size="14" fill="#657180" font-weight="400">응답 시간 추이 · 데이터 연결 대기</text><rect x="728" y="555" width="680" height="135" rx="14" fill="white" stroke="#D7DFE7"/><text x="748" y="590" font-size="19" fill="#202830" font-weight="750">오류 · 재시도 유형</text><rect x="748" y="620" width="640" height="42" rx="8" fill="#F3F5F7" stroke="none"/><circle cx="763" cy="641" r="3" fill="#96A2AF"/><text x="777" y="646" font-size="14" fill="#657180" font-weight="400">유형별 건수 차트 · 데이터 연결 대기</text><circle cx="690" cy="190" r="15" fill="#FFBC42" stroke="#292E35"/><text x="690" y="195" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">1</text><circle cx="1390" cy="190" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1390" y="195" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">2</text><circle cx="690" cy="430" r="15" fill="#FFBC42" stroke="#292E35"/><text x="690" y="435" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">3</text><circle cx="1390" cy="430" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1390" y="435" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">4</text><circle cx="1390" cy="570" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1390" y="575" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">5</text></g><text x="48" y="1054" font-size="24" fill="#202830" font-weight="750">구성요소 명세</text><text x="1280" y="1054" font-size="15" fill="#657180" font-weight="400">Docker local · 2026.11.05</text><rect x="48" y="1076" width="1504" height="42" rx="8" fill="#292E35" stroke="none"/><text x="64" y="1103" font-size="15" fill="white" font-weight="650">No</text><text x="126" y="1103" font-size="15" fill="white" font-weight="650">구성요소</text><text x="360" y="1103" font-size="15" fill="white" font-weight="650">동작 · 표시 규칙</text><text x="1120" y="1103" font-size="15" fill="white" font-weight="650">데이터 · API / 상태</text><rect x="48" y="1118" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1146" font-size="16" fill="#202830" font-weight="750">1</text><text x="126" y="1146" font-size="17" fill="#202830" font-weight="650">외부 API</text><text x="360" y="1143" font-size="15" fill="#657180" font-weight="400">현재 확인 가능한 키 설정 및 세션 호출 상태를 보여 줍니다.</text><text x="1120" y="1143" font-size="14" fill="#657180" font-weight="400">provider_states()</text><rect x="48" y="1186" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1214" font-size="16" fill="#202830" font-weight="750">2</text><text x="126" y="1214" font-size="17" fill="#202830" font-weight="650">에이전트</text><text x="360" y="1211" font-size="15" fill="#657180" font-weight="400">에이전트 처리 단계·재시도 원인과 횟수는 수집 API 연결 대상입니다.</text><text x="1120" y="1211" font-size="14" fill="#657180" font-weight="400">에이전트 관측 API 미구현</text><rect x="48" y="1254" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1282" font-size="16" fill="#202830" font-weight="750">3</text><text x="126" y="1282" font-size="17" fill="#202830" font-weight="650">캐시 · 복구</text><text x="360" y="1279" font-size="15" fill="#657180" font-weight="400">캐시 및 Circuit 상태 수집 전에는 연결 대기를 표시합니다.</text><text x="1120" y="1279" font-size="14" fill="#657180" font-weight="400">캐시 관측 API 미구현</text><rect x="48" y="1322" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1350" font-size="16" fill="#202830" font-weight="750">4</text><text x="126" y="1350" font-size="17" fill="#202830" font-weight="650">품질 · 가드레일</text><text x="360" y="1347" font-size="15" fill="#657180" font-weight="400">품질과 차단 유형은 원문 대화 없이 집계 데이터로 연결할 영역입니다.</text><text x="1120" y="1347" font-size="14" fill="#657180" font-weight="400">집계 API 미구현</text><rect x="48" y="1390" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1418" font-size="16" fill="#202830" font-weight="750">5</text><text x="126" y="1418" font-size="17" fill="#202830" font-weight="650">차트</text><text x="360" y="1415" font-size="15" fill="#657180" font-weight="400">응답 시간은 추이, 오류·재시도는 유형별 건수 차트가 적합합니다.</text><text x="1120" y="1415" font-size="14" fill="#657180" font-weight="400">현재 차트 데이터 연결 대기</text><text x="48" y="1501" font-size="20" fill="#202830" font-weight="750">구현 범위 · 확인 사항</text><text x="64" y="1536" font-size="16" fill="#657180" font-weight="400">• 현재 시각화 영역은 빈 상태 표시입니다. 운영 샘플 수치를 실제 데이터처럼 표시하지 않습니다.</text><text x="64" y="1565" font-size="16" fill="#657180" font-weight="400">• 하단 오류·이벤트 영역에는 요청 ID·시각·출처·오류 유형·결과를 연결할 예정입니다.</text><text x="48" y="1758" font-size="14" fill="#657180" font-weight="400">ChargePin / 화면 설계서 1.1 / 로컬 구현 기준 · 화면 속 데이터는 명세용 표기</text><text x="1480" y="1758" font-size="16" fill="#657180" font-weight="400">08</text></g></svg>