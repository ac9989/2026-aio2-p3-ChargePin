<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800"><title>S02 AI 챗 · 즉시 검색</title><defs><linearGradient id="bolt" x2="0" y2="1"><stop stop-color="#FFD064"/><stop offset=".5" stop-color="#FF8E3C"/><stop offset="1" stop-color="#EC4F51"/></linearGradient></defs><g font-family="Pretendard, Malgun Gothic, sans-serif"><rect x="0" y="0" width="1600" height="1800" rx="0" fill="#F8FAFC" stroke="none"/><rect x="0" y="0" width="1600" height="136" rx="0" fill="#EDF1F5" stroke="none"/><rect x="48" y="30" width="70" height="28" rx="14" fill="#292E35" stroke="none"/><text x="59" y="50" font-size="13" fill="white" font-weight="650">S02</text><text x="170" y="56" font-size="30" fill="#202830" font-weight="750">AI 챗 · 즉시 검색</text><text x="48" y="98" font-size="17" fill="#657180" font-weight="400">조건 해석 후 확인 버튼 없이 검색 / 지도와 목록을 같은 화면에서 갱신</text><rect x="48" y="166" width="1504" height="840" rx="18" fill="white" stroke="#D7DFE7"/><g id="screen" transform="translate(80 190)"><rect x="0" y="0" width="1440" height="110" rx="0" fill="white" stroke="none"/><rect x="28" y="24" width="48" height="48" rx="15" fill="#292E35" stroke="none"/><path d="M55 30 40 52H51L47 67 63 45H53Z" fill="url(#bolt)"/><text x="90" y="48" font-size="24" fill="#202830" font-weight="750">ChargePin</text><text x="90" y="72" font-size="14" fill="#657180" font-weight="400">서울 전기차 충전소 안내</text><circle cx="1312" cy="48" r="22" fill="#F5F7F9" stroke="#D7DFE7"/><text x="1301" y="56" font-size="24" fill="#292E35" font-weight="400">⚙</text><circle cx="1372" cy="48" r="22" fill="#F5F7F9" stroke="#D7DFE7"/><path d="M1372 34V47 M1363 39 A13 13 0 1 0 1381 39" fill="none" stroke="#292E35" stroke-width="2.5"/><rect x="28" y="104" width="1384" height="1" rx="0" fill="#D7DFE7" stroke="none"/><rect x="28" y="130" width="400" height="620" rx="14" fill="white" stroke="#D7DFE7"/><text x="48" y="165" font-size="19" fill="#202830" font-weight="750">충전 장소 찾기</text><rect x="48" y="185" width="160" height="42" rx="10" fill="white" stroke="#D7DFE7"/><text x="128.0" y="212" text-anchor="middle" font-size="16" font-weight="650" fill="#202830">탐색</text><rect x="220" y="185" width="160" height="42" rx="10" fill="#292E35" stroke="#292E35"/><text x="300.0" y="212" text-anchor="middle" font-size="16" font-weight="650" fill="white">AI 챗</text><rect x="48" y="257" width="350" height="88" rx="12" fill="#F1F4F7" stroke="none"/><text x="64" y="286" font-size="17" fill="#202830" font-weight="400">강남역 주변 충전소 찾아줘</text><rect x="48" y="375" width="350" height="112" rx="12" fill="#FFF7E6" stroke="none"/><text x="64" y="404" font-size="17" fill="#202830" font-weight="400">강남역 주변 충전소를 찾았어요.</text><rect x="48" y="650" width="350" height="44" rx="10" fill="#F3F5F7" stroke="none"/><text x="63" y="678" font-size="15" fill="#657180" font-weight="400">메시지 입력</text><rect x="455" y="130" width="955" height="490" rx="16" fill="#EEF2F5" stroke="#D7DFE7"/><rect x="614.1666666666666" y="130" width="12" height="490" rx="0" fill="white" stroke="none"/><rect x="773.3333333333333" y="130" width="12" height="490" rx="0" fill="white" stroke="none"/><rect x="932.5" y="130" width="12" height="490" rx="0" fill="white" stroke="none"/><rect x="1091.6666666666665" y="130" width="12" height="490" rx="0" fill="white" stroke="none"/><rect x="1250.8333333333335" y="130" width="12" height="490" rx="0" fill="white" stroke="none"/><rect x="455" y="252.5" width="955" height="10" rx="0" fill="white" stroke="none"/><rect x="455" y="375.0" width="955" height="10" rx="0" fill="white" stroke="none"/><rect x="455" y="497.5" width="955" height="10" rx="0" fill="white" stroke="none"/><path d="M495 620 L1075.75 130" stroke="#DCE7ED" stroke-width="64"/><circle cx="932.5" cy="375.0" r="145" fill="#FFBC4212" stroke="#FFBC42" stroke-width="2" stroke-dasharray="6 5"/><rect x="475" y="150" width="218" height="28" rx="14" fill="#FFFFFF" stroke="none"/><text x="486" y="170" font-size="13" fill="#657180" font-weight="650">카카오 지도 영역 / 도식</text><text x="470" y="648" font-size="14" fill="#657180" font-weight="400">선택한 위치 기준 · 카카오 지도 · 충전 상태는 환경공단 API 기준입니다.</text><circle cx="410" cy="205" r="15" fill="#FFBC42" stroke="#292E35"/><text x="410" y="210" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">1</text><circle cx="410" cy="300" r="15" fill="#FFBC42" stroke="#292E35"/><text x="410" y="305" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">2</text><circle cx="410" cy="415" r="15" fill="#FFBC42" stroke="#292E35"/><text x="410" y="420" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">3</text><circle cx="410" cy="671" r="15" fill="#FFBC42" stroke="#292E35"/><text x="410" y="676" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">4</text></g><text x="48" y="1054" font-size="24" fill="#202830" font-weight="750">구성요소 명세</text><text x="1280" y="1054" font-size="15" fill="#657180" font-weight="400">Docker local · 2026.11.05</text><rect x="48" y="1076" width="1504" height="42" rx="8" fill="#292E35" stroke="none"/><text x="64" y="1103" font-size="15" fill="white" font-weight="650">No</text><text x="126" y="1103" font-size="15" fill="white" font-weight="650">구성요소</text><text x="360" y="1103" font-size="15" fill="white" font-weight="650">동작 · 표시 규칙</text><text x="1120" y="1103" font-size="15" fill="white" font-weight="650">데이터 · API / 상태</text><rect x="48" y="1118" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1146" font-size="16" fill="#202830" font-weight="750">1</text><text x="126" y="1146" font-size="17" fill="#202830" font-weight="650">모드 전환</text><text x="360" y="1143" font-size="15" fill="#657180" font-weight="400">탐색과 AI 챗을 같은 패널에서 선택합니다. 헤더 위치는 유지합니다.</text><text x="1120" y="1143" font-size="14" fill="#657180" font-weight="400">session_state.mode</text><rect x="48" y="1186" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1214" font-size="16" fill="#202830" font-weight="750">2</text><text x="126" y="1214" font-size="17" fill="#202830" font-weight="650">채팅 입력</text><text x="360" y="1211" font-size="15" fill="#657180" font-weight="400">사용자 문장을 해석 API로 보냅니다. 현 서버는 규칙 기반 해석입니다.</text><text x="1120" y="1211" font-size="14" fill="#657180" font-weight="400">POST /api/v1/chat/plan</text><rect x="48" y="1254" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1282" font-size="16" fill="#202830" font-weight="750">3</text><text x="126" y="1282" font-size="17" fill="#202830" font-weight="650">자동 실행</text><text x="360" y="1279" font-size="15" fill="#657180" font-weight="400">확인 대기 응답이면 프론트가 즉시 확인 API를 호출합니다. 장소는 우선 후보를</text><text x="360" y="1302" font-size="15" fill="#657180" font-weight="400">사용합니다.</text><text x="1120" y="1279" font-size="14" fill="#657180" font-weight="400">POST /api/v1/search/{id}/confirm</text><rect x="48" y="1322" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1350" font-size="16" fill="#202830" font-weight="750">4</text><text x="126" y="1350" font-size="17" fill="#202830" font-weight="650">응답 표시</text><text x="360" y="1347" font-size="15" fill="#657180" font-weight="400">선택 장소와 결과 수를 안내합니다. 부분 실패는 정상 완료와 구분합니다.</text><text x="1120" y="1347" font-size="14" fill="#657180" font-weight="400">status / results / applied_request</text><text x="48" y="1433" font-size="20" fill="#202830" font-weight="750">구현 범위 · 확인 사항</text><text x="64" y="1468" font-size="16" fill="#657180" font-weight="400">• 무료·장시간 우선 추천, 대안 사유 설명, 후속 대화 조건 유지는 목표 기능이며 현재 미구현입니다.</text><text x="64" y="1497" font-size="16" fill="#657180" font-weight="400">• 장소 후보 확인 경로는 백엔드가 반경을 3 km로 고정합니다. 입력 반경 유지 보완이 필요합니다.</text><text x="48" y="1758" font-size="14" fill="#657180" font-weight="400">ChargePin / 화면 설계서 1.1 / 로컬 구현 기준 · 화면 속 데이터는 명세용 표기</text><text x="1480" y="1758" font-size="16" fill="#657180" font-weight="400">04</text></g></svg>