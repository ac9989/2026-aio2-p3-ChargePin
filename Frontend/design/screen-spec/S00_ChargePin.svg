" font-weight="650">접속 코드</text><rect x="395" y="320" width="650" height="44" rx="10" fill="#F3F5F7" stroke="none"/><text x="410" y="348" font-size="15" fill="#657180" font-weight="400">접속 코드를 입력해주세요</text><rect x="395" y="393" width="650" height="42" rx="10" fill="#292E35" stroke="#292E35"/><text x="720.0" y="420" text-anchor="middle" font-size="16" font-weight="650" fill="white">접속하기</text><circle cx="1090" cy="235" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1090" y="240" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">1</text><circle cx="1065" cy="342" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1065" y="347" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">2</text><circle cx="1065" cy="414" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1065" y="419" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">3</text><circle cx="90" cy="30" r="15" fill="#FFBC42" stroke="#292E35"/><text x="90" y="35" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">4</text></g><text x="48" y="1054" font-size="24" fill="#202830" font-weight="750">구성요소 명세</text><text x="1280" y="1054" font-size="15" fill="#657180" font-weight="400">Docker local · 2026.11.05</text><rect x="48" y="1076" width="1504" height="42" rx="8" fill="#292E35" stroke="none"/><text x="64" y="1103" font-size="15" fill="white" font-weight="650">No</text><text x="126" y="1103" font-size="15" fill="white" font-weight="650">구성요소</text><text x="360" y="1103" font-size="15" fill="white" font-weight="650">동작 · 표시 규칙</text><text x="1120" y="1103" font-size="15" fill="white" font-weight="650">데이터 · API / 상태</text><rect x="48" y="1118" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1146" font-size="16" fill="#202830" font-weight="750">1</text><text x="126" y="1146" font-size="17" fill="#202830" font-weight="650">시작하기</text><text x="360" y="1143" font-size="15" fill="#657180" font-weight="400">제목은 “차지핀 시작하기”이며 역할 설명 문구는 표시하지 않습니다.</text><text x="1120" y="1143" font-size="14" fill="#657180" font-weight="400">로그인 전 화면</text><rect x="48" y="1186" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1214" font-size="16" fill="#202830" font-weight="750">2</text><text x="126" y="1214" font-size="17" fill="#202830" font-weight="650">접속 코드</text><text x="360" y="1211" font-size="15" fill="#657180" font-weight="400">비밀번호 입력 필드. 빈 값은 전송 전에 자연어로 안내합니다.</text><text x="1120" y="1211" font-size="14" fill="#657180" font-weight="400">service_key / 원문 문서 비노출</text><rect x="48" y="1254" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1282" font-size="16" fill="#202830" font-weight="750">3</text><text x="126" y="1282" font-size="17" fill="#202830" font-weight="650">접속하기</text><text x="360" y="1279" font-size="15" fill="#657180" font-weight="400">서버 인증 성공 후 사용자 화면으로 진입합니다. 실패는 자연어로 표시합니다.</text><text x="1120" y="1279" font-size="14" fill="#657180" font-weight="400">POST /api/v1/auth/login</text><rect x="48" y="1322" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1350" font-size="16" fill="#202830" font-weight="750">4</text><text x="126" y="1350" font-size="17" fill="#202830" font-weight="650">공통 브랜드</text><text x="360" y="1347" font-size="15" fill="#657180" font-weight="400">번개 아이콘·서비스명·부제 위치와 크기를 사용자·운영 화면에 통일합니다.</text><text x="1120" y="1347" font-size="14" fill="#657180" font-weight="400">서울 전기차 충전소 안내</text><text x="48" y="1433" font-size="20" fill="#202830" font-weight="750">구현 범위 · 확인 사항</text><text x="64" y="1468" font-size="16" fill="#657180" font-weight="400">• 로그인 키와 토큰은 SVG에 포함하지 않습니다.</text><text x="64" y="1497" font-size="16" fill="#657180" font-weight="400">• 기본 진입 시 충전소 검색은 자동 실행하지 않습니다.</text><text x="48" y="1758" font-size="14" fill="#657180" font-weight="400">ChargePin / 화면 설계서 1.1 / 로컬 구현 기준 · 화면 속 데이터는 명세용 표기</text><text x="1480" y="1758" font-size="16" fill="#657180" font-weight="400">02</text></g></svg>