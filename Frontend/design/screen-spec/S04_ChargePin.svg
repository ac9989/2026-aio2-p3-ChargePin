<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800"><title>S04 시스템 상태 · 시연</title><defs><linearGradient id="bolt" x2="0" y2="1"><stop stop-color="#FFD064"/><stop offset=".5" stop-color="#FF8E3C"/><stop offset="1" stop-color="#EC4F51"/></linearGradient></defs><g font-family="Pretendard, Malgun Gothic, sans-serif"><rect x="0" y="0" width="1600" height="1800" rx="0" fill="#F8FAFC" stroke="none"/><rect x="0" y="0" width="1600" height="136" rx="0" fill="#EDF1F5" stroke="none"/><rect x="48" y="30" width="70" height="28" rx="14" fill="#292E35" stroke="none"/><text x="59" y="50" font-size="13" fill="white" font-weight="650">S04</text><text x="170" y="56" font-size="30" fill="#202830" font-weight="750">시스템 상태 · 시연</text><text x="48" y="98" font-size="17" fill="#657180" font-weight="400">번개 아이콘에서 시연 메뉴 호출 / 실제 오류는 API 응답에 따라 안내</text><rect x="48" y="166" width="1504" height="840" rx="18" fill="white" stroke="#D7DFE7"/><g id="screen" transform="translate(80 190)"><rect x="0" y="0" width="1440" height="110" rx="0" fill="white" stroke="none"/><rect x="28" y="24" width="48" height="48" rx="15" fill="#292E35" stroke="none"/><path d="M55 30 40 52H51L47 67 63 45H53Z" fill="url(#bolt)"/><text x="90" y="48" font-size="24" fill="#202830" font-weight="750">ChargePin</text><text x="90" y="72" font-size="14" fill="#657180" font-weight="400">서울 전기차 충전소 안내</text><circle cx="1312" cy="48" r="22" fill="#F5F7F9" stroke="#D7DFE7"/><text x="1301" y="56" font-size="24" fill="#292E35" font-weight="400">⚙</text><circle cx="1372" cy="48" r="22" fill="#F5F7F9" stroke="#D7DFE7"/><path d="M1372 34V47 M1363 39 A13 13 0 1 0 1381 39" fill="none" stroke="#292E35" stroke-width="2.5"/><rect x="28" y="104" width="1384" height="1" rx="0" fill="#D7DFE7" stroke="none"/><rect x="28" y="145" width="1380" height="92" rx="14" fill="white" stroke="#D7DFE7"/><text x="48" y="180" font-size="19" fill="#202830" font-weight="750">결과 없음</text><rect x="270" y="165" width="1115" height="52" rx="8" fill="#F3F5F7" stroke="none"/><text x="290" y="198" font-size="17" fill="#657180" font-weight="400">조건에 맞는 충전소를 찾지 못했습니다.</text><circle cx="1388" cy="158" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1388" y="163" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">1</text><rect x="28" y="253" width="1380" height="92" rx="14" fill="white" stroke="#D7DFE7"/><text x="48" y="288" font-size="19" fill="#202830" font-weight="750">정보 지연</text><rect x="270" y="273" width="1115" height="52" rx="8" fill="#FFF3D6" stroke="none"/><text x="290" y="306" font-size="17" fill="#657180" font-weight="400">최근 상태를 확인하기 어렵습니다.</text><circle cx="1388" cy="266" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1388" y="271" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">2</text><rect x="28" y="361" width="1380" height="92" rx="14" fill="white" stroke="#D7DFE7"/><text x="48" y="396" font-size="19" fill="#202830" font-weight="750">요청 제한</text><rect x="270" y="381" width="1115" height="52" rx="8" fill="#FFF3D6" stroke="none"/><text x="290" y="414" font-size="17" fill="#657180" font-weight="400">요청이 많습니다. 잠시 후 다시 시도해 주세요.</text><circle cx="1388" cy="374" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1388" y="379" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">3</text><rect x="28" y="469" width="1380" height="92" rx="14" fill="white" stroke="#D7DFE7"/><text x="48" y="504" font-size="19" fill="#202830" font-weight="750">인증 · 권한 오류</text><rect x="270" y="489" width="1115" height="52" rx="8" fill="#FDEDEC" stroke="none"/><text x="290" y="522" font-size="17" fill="#657180" font-weight="400">접속 정보 또는 접근 권한을 확인해 주세요.</text><circle cx="1388" cy="482" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1388" y="487" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">4</text><rect x="28" y="577" width="1380" height="92" rx="14" fill="white" stroke="#D7DFE7"/><text x="48" y="612" font-size="19" fill="#202830" font-weight="750">AI 챗 연결 실패</text><rect x="270" y="597" width="1115" height="52" rx="8" fill="#FDEDEC" stroke="none"/><text x="290" y="630" font-size="17" fill="#657180" font-weight="400">응답을 받지 못했습니다. 잠시 후 다시 시도해 주세요.</text><circle cx="1388" cy="590" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1388" y="595" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">5</text></g><text x="48" y="1054" font-size="24" fill="#202830" font-weight="750">구성요소 명세</text><text x="1280" y="1054" font-size="15" fill="#657180" font-weight="400">Docker local · 2026.11.05</text><rect x="48" y="1076" width="1504" height="42" rx="8" fill="#292E35" stroke="none"/><text x="64" y="1103" font-size="15" fill="white" font-weight="650">No</text><text x="126" y="1103" font-size="15" fill="white" font-weight="650">구성요소</text><text x="360" y="1103" font-size="15" fill="white" font-weight="650">동작 · 표시 규칙</text><text x="1120" y="1103" font-size="15" fill="white" font-weight="650">데이터 · API / 상태</text><rect x="48" y="1118" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1146" font-size="16" fill="#202830" font-weight="750">1</text><text x="126" y="1146" font-size="17" fill="#202830" font-weight="650">결과 없음</text><text x="360" y="1143" font-size="15" fill="#657180" font-weight="400">정상 검색 후 결과가 없으면 빈 목록 안내를 표시합니다.</text><text x="1120" y="1143" font-size="14" fill="#657180" font-weight="400">results=[]</text><rect x="48" y="1186" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1214" font-size="16" fill="#202830" font-weight="750">2</text><text x="126" y="1214" font-size="17" fill="#202830" font-weight="650">정보 지연</text><text x="360" y="1211" font-size="15" fill="#657180" font-weight="400">검증 결과와 출처 상태를 근거로 지연·확인 필요를 구분합니다.</text><text x="1120" y="1211" font-size="14" fill="#657180" font-weight="400">critic_findings / availability</text><rect x="48" y="1254" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1282" font-size="16" fill="#202830" font-weight="750">3</text><text x="126" y="1282" font-size="17" fill="#202830" font-weight="650">요청 제한</text><text x="360" y="1279" font-size="15" fill="#657180" font-weight="400">API 오류를 자연어로 안내합니다. 현재 시연 메뉴는 boom 응답 표시입니다.</text><text x="1120" y="1279" font-size="14" fill="#657180" font-weight="400">GET /boom/1..5</text><rect x="48" y="1322" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1350" font-size="16" fill="#202830" font-weight="750">4</text><text x="126" y="1350" font-size="17" fill="#202830" font-weight="650">인증 · 권한</text><text x="360" y="1347" font-size="15" fill="#657180" font-weight="400">접속·운영 접근은 서버 인증 결과를 따릅니다.</text><text x="1120" y="1347" font-size="14" fill="#657180" font-weight="400">401 / 403</text><rect x="48" y="1390" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1418" font-size="16" fill="#202830" font-weight="750">5</text><text x="126" y="1418" font-size="17" fill="#202830" font-weight="650">챗 실패</text><text x="360" y="1415" font-size="15" fill="#657180" font-weight="400">예외를 대화에 표시하고 확인 질문 없이 재시도 가능한 입력을 유지합니다.</text><text x="1120" y="1415" font-size="14" fill="#657180" font-weight="400">ApiError</text><text x="48" y="1501" font-size="20" fill="#202830" font-weight="750">구현 범위 · 확인 사항</text><text x="64" y="1536" font-size="16" fill="#657180" font-weight="400">• 시연 응답 표시와 화면 전체 입력 잠금은 구분해야 합니다. 시연 메뉴만으로 전역 입력은 잠기지 않습니다.</text><text x="64" y="1565" font-size="16" fill="#657180" font-weight="400">• 본문 문구는 상태별 표현 규칙 예시이며 API 원문을 그대로 노출하지 않습니다.</text><text x="48" y="1758" font-size="14" fill="#657180" font-weight="400">ChargePin / 화면 설계서 1.1 / 로컬 구현 기준 · 화면 속 데이터는 명세용 표기</text><text x="1480" y="1758" font-size="16" fill="#657180" font-weight="400">06</text></g></svg>