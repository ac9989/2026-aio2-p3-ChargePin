font-weight="400">장소 입력 후 카카오 후보에서 검색 기준 장소를 선택합니다.</text><text x="1120" y="1211" font-size="14" fill="#657180" font-weight="400">POST /api/v1/places/suggest</text><rect x="48" y="1254" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1282" font-size="16" fill="#202830" font-weight="750">3</text><text x="126" y="1282" font-size="17" fill="#202830" font-weight="650">충전기 타입</text><text x="360" y="1279" font-size="15" fill="#657180" font-weight="400">급속·완속 다중 선택. 선택 태그와 주요 버튼은 차콜입니다.</text><text x="1120" y="1279" font-size="14" fill="#657180" font-weight="400">connector_types: FAST / SLOW</text><rect x="48" y="1322" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1350" font-size="16" fill="#202830" font-weight="750">4</text><text x="126" y="1350" font-size="17" fill="#202830" font-weight="650">충전소 분류</text><text x="360" y="1347" font-size="15" fill="#657180" font-weight="400">검색 결과에 전달된 시설 분류만 선택할 수 있습니다. 없으면 비활성입니다.</text><text x="1120" y="1347" font-size="14" fill="#657180" font-weight="400">results[].facility_type</text><rect x="48" y="1390" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1418" font-size="16" fill="#202830" font-weight="750">5</text><text x="126" y="1418" font-size="17" fill="#202830" font-weight="650">충전소 검색</text><text x="360" y="1415" font-size="15" fill="#657180" font-weight="400">선택된 장소와 조건을 보내고 지도·목록을 갱신합니다.</text><text x="1120" y="1415" font-size="14" fill="#657180" font-weight="400">POST /api/v1/search</text><rect x="48" y="1458" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1486" font-size="16" fill="#202830" font-weight="750">6</text><text x="126" y="1486" font-size="17" fill="#202830" font-weight="650">지도 출처</text><text x="360" y="1483" font-size="15" fill="#657180" font-weight="400">카카오 지도와 환경공단 충전 상태의 출처 안내는 지도 아래에 표시합니다.</text><text x="1120" y="1483" font-size="14" fill="#657180" font-weight="400">Kakao Maps JS / ChargerResult</text><text x="48" y="1569" font-size="20" fill="#202830" font-weight="750">구현 범위 · 확인 사항</text><text x="64" y="1604" font-size="16" fill="#657180" font-weight="400">• 외부인 이용·주차 요금·출력·커넥터 상세 필터는 현재 탐색 UI에 구현되어 있지 않습니다.</text><text x="64" y="1633" font-size="16" fill="#657180" font-weight="400">• 아파트·공동주택으로 이름 또는 시설 분류에서 식별된 결과를 프론트에서 제외합니다.</text><text x="48" y="1758" font-size="14" fill="#657180" font-weight="400">ChargePin / 화면 설계서 1.1 / 로컬 구현 기준 · 화면 속 데이터는 명세용 표기</text><text x="1480" y="1758" font-size="16" fill="#657180" font-weight="400">03</text></g></svg>