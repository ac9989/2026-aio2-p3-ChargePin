<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800"><title>A01 운영 개요</title><defs><linearGradient id="bolt" x2="0" y2="1"><stop stop-color="#FFD064"/><stop offset=".5" stop-color="#FF8E3C"/><stop offset="1" stop-color="#EC4F51"/></linearGradient></defs><g font-family="Pretendard, Malgun Gothic, sans-serif"><rect x="0" y="0" width="1600" height="1800" rx="0" fill="#F8FAFC" stroke="none"/><rect x="0" y="0" width="1600" height="136" rx="0" fill="#EDF1F5" stroke="none"/><rect x="48" y="30" width="70" height="28" rx="14" fill="#292E35" stroke="none"/><text x="59" y="50" font-size="13" fill="white" font-weight="650">A01</text><text x="170" y="56" font-size="30" fill="#202830" font-weight="750">운영 개요</text><text x="48" y="98" font-size="17" fill="#657180" font-weight="400">차콜 헤더·메뉴 / 화이트 본문 / 카드 내부 여백 20 px / 공통 헤더 정렬</text><rect x="48" y="166" width="1504" height="840" rx="18" fill="white" stroke="#D7DFE7"/><g id="screen" transform="translate(80 190)"><rect x="0" y="0" width="1440" height="150" rx="0" fill="#292E35" stroke="none"/><rect x="28" y="24" width="48" height="48" rx="15" fill="#41474F" stroke="none"/><path d="M55 30 40 52H51L47 67 63 45H53Z" fill="url(#bolt)"/><text x="90" y="48" font-size="24" fill="white" font-weight="750">ChargePin 운영 대시보드</text><text x="90" y="72" font-size="14" fill="#CED4DA" font-weight="400">서비스 상태 및 운영 이력</text><circle cx="1312" cy="48" r="22" fill="#41474F" stroke="#6A717A"/><text x="1301" y="56" font-size="24" fill="white" font-weight="400">⚙</text><circle cx="1372" cy="48" r="22" fill="#41474F" stroke="#6A717A"/><path d="M1372 34V47 M1363 39 A13 13 0 1 0 1381 39" fill="none" stroke="white" stroke-width="2.5"/><text x="30" y="125" font-size="17" fill="white" font-weight="650">운영 개요</text><rect x="30" y="142" width="140" height="3" rx="0" fill="#FFBC42" stroke="none"/><text x="210" y="125" font-size="17" fill="#CED4DA" font-weight="650">서비스 운영</text><text x="390" y="125" font-size="17" fill="#CED4DA" font-weight="650">배포 · 감사 이력</text><rect x="28" y="175" width="330" height="120" rx="14" fill="white" stroke="#D7DFE7"/><text x="48" y="210" font-size="19" fill="#202830" font-weight="750">백엔드</text><text x="48" y="263" font-size="24" fill="#202830" font-weight="750">정상 / 연결 불가</text><rect x="378" y="175" width="330" height="120" rx="14" fill="white" stroke="#D7DFE7"/><text x="398" y="210" font-size="19" fill="#202830" font-weight="750">요청 성공률</text><text x="398" y="263" font-size="24" fill="#202830" font-weight="750">연결 대기</text><rect x="728" y="175" width="330" height="120" rx="14" fill="white" stroke="#D7DFE7"/><text x="748" y="210" font-size="19" fill="#202830" font-weight="750">재시도율</text><text x="748" y="263" font-size="24" fill="#202830" font-weight="750">연결 대기</text><rect x="1078" y="175" width="330" height="120" rx="14" fill="white" stroke="#D7DFE7"/><text x="1098" y="210" font-size="19" fill="#202830" font-weight="750">최근 배포</text><text x="1098" y="263" font-size="24" fill="#202830" font-weight="750">연결 대기</text><rect x="28" y="315" width="1380" height="105" rx="14" fill="white" stroke="#D7DFE7"/><text x="48" y="350" font-size="19" fill="#202830" font-weight="750">요청 현황</text><rect x="48" y="365" width="1340" height="42" rx="8" fill="#F3F5F7" stroke="none"/><circle cx="63" cy="386" r="3" fill="#96A2AF"/><text x="77" y="391" font-size="14" fill="#657180" font-weight="400">시계열 지표 연결 대기</text><rect x="28" y="440" width="680" height="195" rx="14" fill="white" stroke="#D7DFE7"/><text x="48" y="475" font-size="19" fill="#202830" font-weight="750">외부 연결</text><text x="48" y="505" font-size="14" fill="#202830" font-weight="400">카카오 지도</text><text x="400" y="505" font-size="14" fill="#657180" font-weight="400">지도 키 설정 여부</text><text x="48" y="534" font-size="14" fill="#202830" font-weight="400">카카오 장소</text><text x="400" y="534" font-size="14" fill="#657180" font-weight="400">최근 조회 / 호출 이력</text><text x="48" y="563" font-size="14" fill="#202830" font-weight="400">환경공단 충전기</text><text x="400" y="563" font-size="14" fill="#657180" font-weight="400">검색 응답 / 원천 상태 확인</text><text x="48" y="592" font-size="14" fill="#202830" font-weight="400">캐시</text><text x="400" y="592" font-size="14" fill="#657180" font-weight="400">상태 수집 대기</text><rect x="728" y="440" width="680" height="195" rx="14" fill="white" stroke="#D7DFE7"/><text x="748" y="475" font-size="19" fill="#202830" font-weight="750">데이터 품질</text><text x="748" y="512" font-size="15" fill="#657180" font-weight="400">최신성 · 누락 · 비정상 값</text><rect x="748" y="554" width="640" height="42" rx="8" fill="#F3F5F7" stroke="none"/><circle cx="763" cy="575" r="3" fill="#96A2AF"/><text x="777" y="580" font-size="14" fill="#657180" font-weight="400">품질 분포 차트 · 데이터 연결 대기</text><rect x="28" y="655" width="1380" height="100" rx="14" fill="white" stroke="#D7DFE7"/><text x="48" y="690" font-size="19" fill="#202830" font-weight="750">최근 운영 이벤트</text><rect x="48" y="702" width="1340" height="42" rx="8" fill="#F3F5F7" stroke="none"/><circle cx="63" cy="723" r="3" fill="#96A2AF"/><text x="77" y="728" font-size="14" fill="#657180" font-weight="400">요청 ID · 발생 시각 · 처리 단계 · 결과 연결 대기</text><circle cx="1390" cy="128" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1390" y="133" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">1</text><circle cx="1390" cy="190" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1390" y="195" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">2</text><circle cx="690" cy="455" r="15" fill="#FFBC42" stroke="#292E35"/><text x="690" y="460" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">3</text><circle cx="1390" cy="455" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1390" y="460" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">4</text><circle cx="1390" cy="668" r="15" fill="#FFBC42" stroke="#292E35"/><text x="1390" y="673" text-anchor="middle" font-size="14" font-weight="750" fill="#292E35">5</text></g><text x="48" y="1054" font-size="24" fill="#202830" font-weight="750">구성요소 명세</text><text x="1280" y="1054" font-size="15" fill="#657180" font-weight="400">Docker local · 2026.11.05</text><rect x="48" y="1076" width="1504" height="42" rx="8" fill="#292E35" stroke="none"/><text x="64" y="1103" font-size="15" fill="white" font-weight="650">No</text><text x="126" y="1103" font-size="15" fill="white" font-weight="650">구성요소</text><text x="360" y="1103" font-size="15" fill="white" font-weight="650">동작 · 표시 규칙</text><text x="1120" y="1103" font-size="15" fill="white" font-weight="650">데이터 · API / 상태</text><rect x="48" y="1118" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1146" font-size="16" fill="#202830" font-weight="750">1</text><text x="126" y="1146" font-size="17" fill="#202830" font-weight="650">운영 메뉴</text><text x="360" y="1143" font-size="15" fill="#657180" font-weight="400">운영 개요·서비스 운영·배포 감사 이력. 활성 메뉴에 앰버 밑선을 표시합니다.</text><text x="1120" y="1143" font-size="14" fill="#657180" font-weight="400">session_state.dashboard_navigation</text><rect x="48" y="1186" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1214" font-size="16" fill="#202830" font-weight="750">2</text><text x="126" y="1214" font-size="17" fill="#202830" font-weight="650">핵심 지표</text><text x="360" y="1211" font-size="15" fill="#657180" font-weight="400">백엔드 상태만 health 응답입니다. 성공률·재시도·최근 배포는 연결 대기입니다.</text><text x="1120" y="1211" font-size="14" fill="#657180" font-weight="400">GET /healthz</text><rect x="48" y="1254" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1282" font-size="16" fill="#202830" font-weight="750">3</text><text x="126" y="1282" font-size="17" fill="#202830" font-weight="650">외부 연결</text><text x="360" y="1279" font-size="15" fill="#657180" font-weight="400">키 설정과 세션 호출 이력을 표시합니다. 원천 서비스 정상 판정과 구분합니다.</text><text x="1120" y="1279" font-size="14" fill="#657180" font-weight="400">provider_states() / 세션 기반</text><rect x="48" y="1322" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1350" font-size="16" fill="#202830" font-weight="750">4</text><text x="126" y="1350" font-size="17" fill="#202830" font-weight="650">데이터 품질</text><text x="360" y="1347" font-size="15" fill="#657180" font-weight="400">현재 데이터 집계 연결 대기입니다. 연결 후 차트로 표시할 영역입니다.</text><text x="1120" y="1347" font-size="14" fill="#657180" font-weight="400">운영 집계 API 미구현</text><rect x="48" y="1390" width="1504" height="68" rx="0" fill="white" stroke="#D7DFE7"/><text x="68" y="1418" font-size="16" fill="#202830" font-weight="750">5</text><text x="126" y="1418" font-size="17" fill="#202830" font-weight="650">운영 이벤트</text><text x="360" y="1415" font-size="15" fill="#657180" font-weight="400">실제 이벤트 수집 경로 연결 전에는 이벤트 수치를 생성하지 않습니다.</text><text x="1120" y="1415" font-size="14" fill="#657180" font-weight="400">운영 로그 API 미구현</text><text x="48" y="1501" font-size="20" fill="#202830" font-weight="750">구현 범위 · 확인 사항</text><text x="64" y="1536" font-size="16" fill="#657180" font-weight="400">• 화면 도식의 “정상 / 연결 불가”는 상태 종류입니다. 실제 상태 스냅샷을 의미하지 않습니다.</text><text x="64" y="1565" font-size="16" fill="#657180" font-weight="400">• 기본 관리자 운영 화면은 하나입니다. 문서에서 관리자 1·2·3 별도 화면을 추가하지 않습니다.</text><text x="48" y="1758" font-size="14" fill="#657180" font-weight="400">ChargePin / 화면 설계서 1.1 / 로컬 구현 기준 · 화면 속 데이터는 명세용 표기</text><text x="1480" y="1758" font-size="16" fill="#657180" font-weight="400">07</text></g></svg>